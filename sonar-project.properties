# =====================================================================
#  Configuración de SonarQube Cloud
#  Reemplaza los dos valores marcados con <...> por los que te muestra
#  SonarQube Cloud al importar el repositorio (Information del proyecto).
# =====================================================================
# sonar.organization solo se usa en SonarQube Cloud
sonar.projectKey=tienda-ventas
sonar.projectName=Sistema de ventas El Mantaro (PA3)
sonar.projectVersion=1.1.2

# Código fuente y pruebas
sonar.sources=src,public,scripts,database
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Evidencias, documentación y archivos generados no son código
sonar.exclusions=docs/**,coverage/**,node_modules/**

# Cobertura generada por "npm run test:sonar" (node:test, formato LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# El frontend (public/) y los scripts se verifican con las pruebas E2E y de
# accesibilidad en el navegador, que no generan cobertura de líneas.
sonar.coverage.exclusions=public/**,scripts/**,database/**,src/server.js

# Las pruebas repiten estructuras a propósito (casos tabulados)
sonar.cpd.exclusions=tests/**
